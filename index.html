<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashar Adeel</title>
<meta name="description" content="Ashar Adeel - CV, dev, personal and client sites.">
<style>
  :root {
    --bg: #0e0b16;
    --fg: #f5f3fa;
    --muted: #9b94b3;
    --line: #2a2440;
    --accent: #7c3aed;
    --card: #17132a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf9fd;
      --fg: #1a1530;
      --muted: #6b6485;
      --line: #e1ddf0;
      --card: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 6vh 24px 48px;
    flex: 1;
  }
  .name-wrap { width: 100%; overflow: hidden; }
  h1 {
    margin: 0;
    display: inline-block;
    white-space: nowrap;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    font-size: 12vw;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  .tag {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: clamp(14px, 1.6vw, 18px);
  }
  h2 {
    margin: 56px 0 16px;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  a.card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 120px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--fg);
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    outline: none;
  }
  .card .title { font-size: 22px; font-weight: 700; }
  .card .host { margin-top: 18px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  .card .arrow { color: var(--accent); font-weight: 700; }
  footer {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <div class="name-wrap"><h1 id="name">Ashar <span>Adeel</span></h1></div>
  <p class="tag">Choose where you want to go.</p>

  <h2>My sites</h2>
  <div class="grid">
    <a class="card" href="https://cv.ashars.co.uk">
      <span class="title">CV</span>
      <span class="host"><span>cv.ashars.co.uk</span><span class="arrow">&rarr;</span></span>
    </a>
    <a class="card" href="https://dev.ashars.co.uk">
      <span class="title">Dev</span>
      <span class="host"><span>dev.ashars.co.uk</span><span class="arrow">&rarr;</span></span>
    </a>
    <a class="card" href="https://personal.ashars.co.uk">
      <span class="title">Personal</span>
      <span class="host"><span>personal.ashars.co.uk</span><span class="arrow">&rarr;</span></span>
    </a>
  </div>

  <h2>Client sites</h2>
  <div class="grid">
    <a class="card" href="https://clipping.ashars.co.uk">
      <span class="title">ClipprJct</span>
      <span class="host"><span>clipping.ashars.co.uk</span><span class="arrow">&rarr;</span></span>
    </a>
    <a class="card" href="https://floralfinesse.neocities.org/homepage">
      <span class="title">Floral Finesse</span>
      <span class="host"><span>floralfinesse.neocities.org</span><span class="arrow">&rarr;</span></span>
    </a>
    <a class="card" href="https://asharadeel.github.io/Millyscakery-Website/">
      <span class="title">Milly's Cakery</span>
      <span class="host"><span>asharadeel.github.io/Millyscakery-Website</span><span class="arrow">&rarr;</span></span>
    </a>
  </div>
</main>
<footer>&copy; <span id="yr"></span> Ashar Adeel</footer>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  // Scale the name so it spans the full width of the page content.
  function fitName() {
    var el = document.getElementById('name');
    var box = el.parentElement.clientWidth;
    el.style.fontSize = '100px';
    var w = el.getBoundingClientRect().width;
    if (w > 0) el.style.fontSize = (100 * box / w) + 'px';
  }
  window.addEventListener('resize', fitName);
  window.addEventListener('load', fitName);
  fitName();
</script>
</body>
</html>
